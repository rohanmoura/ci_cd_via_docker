# name of the workflow
name: Manual Docker CI

# Workflow kab run hogi
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  # manually run
  workflow_dispatch:

# Workflow ko repository ka content sirf read karne ki permission hai.
permissions:
  contents: read

# Ye bahut useful configuration hai.
# Agar tum ek ke baad ek multiple commits push kar do:
# Matlab purane unnecessary builds cancel ho jayenge.
# Ye GitHub Actions minutes aur resources bachata hai.
concurrency:
  group: manual-docker-ci-${{ github.ref}}
  cancel-in-progress: true

# Global Variables
env:
  NEXT_PUBLIC_HTTP_SERVER_URL: ${{ vars.NEXT_PUBLIC_HTTP_SERVER_URL || 'http://localhost:3001' }}
  NEXT_PUBLIC_WS_SERVER_URL:
    ${{ vars.NEXT_PUBLIC_WS_SERVER_URL || 'ws://localhost:3002' }}

    #     QUALITY JOB
    #          │
    #          ▼
    #  ┌───────────────┐
    #  │ Format Check  │
    #  │ Lint          │
    #  │ Type Check    │
    #  │ Tests         │
    #  │ Build         │
    #  └───────────────┘
    #          │
    #          │ Success
    #          ▼
    #     DOCKER JOB
    #          │
    #    ┌─────┼─────┐
    #    ▼     ▼     ▼
    #   Web   HTTP   WS

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install Dependencies
        run: bun ci

      - name: Check formatting
        run: bun run format:check

      - name: Run Lint
        run: bun run lint

      - name: Run Type Check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build Application
        run: bun run build

  docker:
    name: Docker image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - quality

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            image: ci-cd-via-docker-web
            dockerfile: apps/web/Dockerfile
            build-args: |
              NEXT_PUBLIC_HTTP_SERVER_URL=${{ vars.NEXT_PUBLIC_HTTP_SERVER_URL || 'http://localhost:3001' }}
              NEXT_PUBLIC_WS_SERVER_URL=${{ vars.NEXT_PUBLIC_WS_SERVER_URL || 'ws://localhost:3002' }}

          - service: http
            image: ci-cd-via-docker-http
            dockerfile: apps/http-server/Dockerfile
            build-args: ""

          - service: ws
            image: ci-cd-via-docker-ws
            dockerfile: apps/ws-server/Dockerfile
            build-args: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker Tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image}}
          tags: |
            type=raw,value=${{ github.sha}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main'}}

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Validate Docker Image
        run: |
          docker image inspect \
              "${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}"

          docker run \
              --rm \
              --entrypoint bun \
              "${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}" \
              --version

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name != 'pull_request'
        run: |
          docker push --all-tags \
              "${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}"
