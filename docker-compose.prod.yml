name: ci-cd-via-docker-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  ws:
    image: ${DOCKERHUB_USERNAME}/ci-cd-via-docker-ws:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WS_INTERNAL_TOKEN: ${WS_INTERNAL_TOKEN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--quiet", "http://localhost:3002/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  http:
    image: ${DOCKERHUB_USERNAME}/ci-cd-via-docker-http:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WS_INTERNAL_EVENT_URL: http://ws:3002/events
      WS_INTERNAL_TOKEN: ${WS_INTERNAL_TOKEN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      ws:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--quiet", "http://localhost:3001/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  web:
    image: ${DOCKERHUB_USERNAME}/ci-cd-via-docker-web:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    depends_on:
      http:
        condition: service_healthy
      ws:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
    external: true
    name: project-postgres-data

networks:
  app-network:
    driver: bridge